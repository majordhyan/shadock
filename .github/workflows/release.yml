name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew
      - run: ./gradlew build --stacktrace --no-configuration-cache

      - uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar

      # needs a CURSEFORGE_TOKEN secret (curseforge.com/account/api-tokens)
      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: 1790443
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            build/libs/!(*-@(dev|sources)).jar
          loaders: fabric
          game-versions: '26.3'
          java: 25
          dependencies: |
            fabric-api(required)
            iris(required)
            sodium(optional)
